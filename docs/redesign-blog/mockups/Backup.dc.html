<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save your backup codes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&amp;family=Caveat:wght@500;700&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:#F3F1EC}a:hover{color:#FF6A47}
.lg{container-type:inline-size;container-name:page;min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;background:#16161A;color:#F3F1EC;font-family:Geist,system-ui,sans-serif;background-image:linear-gradient(rgb(243 241 236 / .05) 1px,transparent 1px),linear-gradient(90deg,rgb(243 241 236 / .05) 1px,transparent 1px);background-size:32px 32px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 48px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.back{display:inline-flex;align-items:center;min-height:44px;font-family:"Geist Mono",monospace;font-size:13px;text-decoration:none}
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:96px;padding:40px 48px 72px;flex-wrap:wrap}
.say{max-width:420px}
.big{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(52px,7cqi,104px);line-height:.88;letter-spacing:-.05em}
.serif{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;letter-spacing:-.02em;color:#FF6A47}
.note{font-family:Caveat,cursive;font-weight:700}
.card{position:relative;width:100%;max-width:420px;box-sizing:border-box;padding:32px;background:#F3F1EC;color:#16161A;border-radius:20px;box-shadow:10px 10px 0 #E8492A;rotate:1deg}
.tape{position:absolute;width:110px;height:28px;background:#E8492A99}
.field{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px}
.field input{min-height:46px;padding:0 14px;border:1.5px solid #16161A;border-radius:12px;background:#FBFAF7;font-family:Geist,sans-serif;font-size:15px;color:#16161A}
.field input:focus{outline:3px solid #E8492A;outline-offset:2px}
.go{min-height:50px;border:1.5px solid #16161A;border-radius:999px;background:#E8492A;color:#16161A;font-family:Geist,sans-serif;font-weight:600;font-size:16px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.go:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 #16161A}
.ln{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
.ln>span{display:block}
@keyframes lineUp{from{translate:0 105%}to{translate:0 0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}
@keyframes slap{0%{opacity:0;scale:1.5}60%{opacity:1;scale:.94}100%{opacity:1;scale:1}}
@keyframes cardIn{from{opacity:0;translate:0 -140px;rotate:-9deg}to{opacity:1;translate:0 0;rotate:1deg}}
@keyframes write{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% 0 -20% 0)}}
@keyframes drift{from{background-position:0 0,0 0}to{background-position:0 32px,32px 0}}
@keyframes shakeA{0%,100%{translate:0 0}20%{translate:-10px 0}40%{translate:9px 0}60%{translate:-6px 0}80%{translate:4px 0}}
@keyframes shakeB{0%,100%{translate:0 0}20%{translate:-10px 0}40%{translate:9px 0}60%{translate:-6px 0}80%{translate:4px 0}}
.lg{animation:drift 8s linear infinite}
.in-fade{animation:fade .6s ease-out backwards}
.in-line{animation:lineUp .9s cubic-bezier(.2,.7,.2,1) backwards}
.in-up{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) backwards}
.in-card{animation:cardIn .9s cubic-bezier(.2,.9,.25,1.2) backwards}
.in-slap{animation:slap .45s cubic-bezier(.2,.7,.2,1) backwards}
.in-write{animation:write .9s steps(14,end) backwards}
.shakeA{animation:shakeA .45s cubic-bezier(.3,.7,.4,1)}
.shakeB{animation:shakeB .45s cubic-bezier(.3,.7,.4,1)}
.go span{display:inline-block;transition:translate .2s}
.go:hover span{translate:4px 0}
.err-in{animation:fadeUp .3s ease-out}
.calm.lg{animation:none}
.calm .in-line,.calm .in-up,.calm .in-card,.calm .in-slap,.calm .in-write{animation-name:fade !important}
.calm .shakeA,.calm .shakeB{animation:none}
@media (prefers-reduced-motion: reduce){
.lg{animation:none}
.in-line,.in-up,.in-card,.in-slap,.in-write{animation-name:fade !important}
.shakeA,.shakeB{animation:none}
}
@container page (max-width: 759px){
.top{padding:16px 20px}
.stage{gap:32px;padding:16px 20px 48px;align-items:flex-start}
.say{max-width:none}
.card{rotate:0deg;padding:24px;box-shadow:6px 6px 0 #E8492A}
}
</style>
<style>
@keyframes pop{0%{scale:.4;opacity:0}70%{scale:1.15;opacity:1}100%{scale:1;opacity:1}}
@keyframes drop{from{opacity:0;translate:0 -30px;rotate:var(--r0,8deg)}to{opacity:1;translate:0 0;rotate:var(--rot,0deg)}}
@keyframes stamp{0%{opacity:0;scale:2.2;rotate:-24deg}60%{opacity:1;scale:.92}100%{opacity:1;scale:1;rotate:-8deg}}
.in-pop{animation:pop .45s cubic-bezier(.2,.7,.2,1.4) backwards}
.in-drop{animation:drop .6s cubic-bezier(.2,.9,.25,1.25) backwards}
.digits{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.digit{width:100%;box-sizing:border-box;height:62px;text-align:center;border:1.5px solid #16161A;border-radius:12px;background:#FBFAF7;font-family:"Geist Mono",monospace;font-weight:500;font-size:26px;color:#16161A}
.digit:focus{outline:3px solid #E8492A;outline-offset:2px}
.digit.filled{background:#E6E0D2}
.mono-in{min-height:52px;padding:0 14px;border:1.5px solid #16161A;border-radius:12px;background:#FBFAF7;font-family:"Geist Mono",monospace;font-size:20px;letter-spacing:.12em;color:#16161A}
.tick{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;cursor:pointer}
.tick input{appearance:none;flex:none;width:24px;height:24px;margin:0;border:1.5px solid #16161A;border-radius:6px;background:#FBFAF7;display:grid;place-content:center;cursor:pointer}
.tick input::after{content:"";width:13px;height:7px;border-left:3px solid #B8361A;border-bottom:3px solid #B8361A;rotate:-45deg;translate:0 -2px;scale:0;transition:scale .2s cubic-bezier(.2,.7,.2,1.6)}
.tick input:checked::after{scale:1}
.tick input:focus-visible{outline:3px solid #E8492A;outline-offset:2px}
.small{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1.5px solid #16161A;border-radius:999px;background:transparent;color:#16161A;font-family:Geist,sans-serif;font-weight:500;font-size:14px;text-decoration:none;cursor:pointer}
.small:disabled{opacity:.6;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px}
.alert{padding:10px 14px;border-radius:12px;border:1.5px solid #16161A;font-size:14px;line-height:1.45}
.alert.err{background:#E8492A22;color:#8F2A14}
.alert.ok{background:#1F7A4D1F;color:#165C3A}
.stampv{position:absolute;right:22px;bottom:84px;padding:6px 14px;border:3px solid #1F7A4D;border-radius:10px;color:#1F7A4D;font-family:"Geist Mono",monospace;font-weight:500;font-size:18px;letter-spacing:.1em;text-transform:uppercase;animation:stamp .5s cubic-bezier(.2,.7,.2,1.2) backwards;rotate:-8deg;background:#F3F1EC}
.tickets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ticket{position:relative;display:flex;align-items:center;justify-content:center;min-height:52px;border:1.5px dashed #16161A;border-radius:10px;background:#FBFAF7;font-family:"Geist Mono",monospace;font-weight:500;font-size:17px;letter-spacing:.08em;rotate:var(--rot,0deg)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:999px;background:#F3F1EC;border:1.5px dashed #16161A}
.ticket::before{left:-8px;clip-path:inset(0 0 0 50%)}
.ticket::after{right:-8px;clip-path:inset(0 50% 0 0)}
.copied{position:absolute;left:50%;top:-30px;translate:-50% 0;rotate:-4deg;font-size:22px;white-space:nowrap;color:#B8361A;animation:pop .4s cubic-bezier(.2,.7,.2,1.4)}
.calm .in-pop,.calm .in-drop{animation-name:fade !important}
.calm .stampv{animation:fade .3s backwards}
@media (prefers-reduced-motion: reduce){.in-pop,.in-drop{animation-name:fade !important}.stampv{animation:fade .3s backwards}}
@container page (max-width: 759px){.digits{gap:6px}.digit{height:54px;font-size:22px}.tickets{gap:10px}.ticket{font-size:15px}}
</style>
</helmet>
<div class="lg {{calmClass}}">
  <div class="top">
    <a class="logo" href="/">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 4c2 0 3.5 1.2 4.6 3.2L28 21c1.6 3.2-.4 7-4 7H8c-3.6 0-5.6-3.8-4-7l7.4-13.8C12.5 5.2 14 4 16 4z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"></path><rect x="12" y="19" width="8" height="9" rx="1" fill="currentColor"></rect></svg>
      carls.dale.escalo
    </a>
  </div>

  <main class="stage">
    <div class="say">
      <div class="in-fade" style="animation-delay: .05s; font-family: 'Geist Mono', monospace; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #C9C5BB">First sign-in · one time only</div>
      <h1 class="big" style="margin-top: 14px"><span class="ln"><span class="in-line" style="animation-delay: .15s">Save your</span></span><span class="ln"><span class="in-line serif" style="animation-delay: .27s">backup codes.</span></span></h1>
      <p class="in-up" style="animation-delay: .5s; margin: 24px 0 0; font-size: 18px; line-height: 1.6; color: #C9C5BB">Each code works once if you lose access to your email. They will not be shown again.</p>
    </div>

    <div class="card in-card" style="display: flex; flex-direction: column; gap: 18px; animation-delay: .3s">
      <span class="tape in-slap" style="left: 40px; top: -14px; rotate: -4deg; animation-delay: 1.05s"></span>
      <span class="tape in-slap" style="right: 40px; top: -12px; rotate: 5deg; width: 90px; animation-delay: 1.15s"></span>
      <span class="note in-write" style="position: absolute; right: -24px; bottom: -34px; rotate: -5deg; font-size: 26px; color: #FF6A47; animation-delay: 2s">keep these somewhere safe ✎</span>
      <div class="tickets" aria-label="Backup codes">
        <sc-for list="{{codes}}" as="c" hint-placeholder-count="10">
          <span class="ticket in-drop" style="--rot: {{c.rot}}; --r0: {{c.r0}}; animation-delay: {{c.delay}}">{{c.code}}</span>
        </sc-for>
      </div>
      <div style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #4A463F">[sample codes — the real ones are generated per admin]</div>
      <div class="row">
        <button class="small" type="button" onClick="{{copy}}" style="position: relative">
          {{copyLabel}}
          <sc-if value="{{copied}}" hint-placeholder-val="{{ false }}"><span class="note copied" aria-live="polite">copied!</span></sc-if>
        </button>
        <a class="go" href="/admin" style="flex: 1; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #16161A">Continue to Admin <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"enum","options":["full","calm"],"default":"full"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { copied: false };
  }
  renderVals() {
    const sample = ['K7QD-M2XP', 'R4TW-9HNC', 'B8LZ-Q3VE', 'H2MY-7KDF', 'W9PC-X4GT', 'N6JE-R8SB', 'T3VK-5QWM', 'F7XA-2LHR', 'D5GN-Y9CU', 'P4ZS-6TJK'];
    const rots = ['-1.5deg', '1deg', '.5deg', '-1deg', '1.5deg'];
    const codes = sample.map((code, i) => ({ code, rot: rots[i % 5], r0: (i % 2 ? '-' : '') + '10deg', delay: (0.9 + i * 0.07).toFixed(2) + 's' }));
    return {
      calmClass: (this.props.motion ?? 'full') === 'calm' ? 'calm' : '',
      codes,
      copied: this.state.copied,
      copyLabel: this.state.copied ? 'Copied' : 'Copy codes',
      copy: () => { this.setState({ copied: true }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ copied: false }), 2000); },
    };
  }
}
</script>
</body>
</html>
